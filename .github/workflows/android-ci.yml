name: Android CI
on:
  push:
    branches: [ "main", "nova-boost-foundation", "fix/session-network-provenance", "feature/nova-ping-1.11-session-compare", "feature/nova-ping-1.12-diagnostic-reliability", "feature/nova-ping-1.13-animated-ui-optimizer-bridge", "feature/nova-ping-1.14-dashboard-experience", "feature/nova-ping-1.15-reliability-engine", "feature/nova-ping-1.16-measurement-integrity", "audit/nova-ping-1.16-certification", "feature/nova-boost-ui-1.17" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run metric unit tests
        run: gradle :app:testDebugUnitTest
      - name: Run Android Lint
        run: gradle :app:lintDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build release APK
        run: gradle :app:assembleRelease
      - name: Generate release dependency inventory
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt
      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: nova-ping-certification-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: nova-ping-release-dependencies
          path: dependency-report.txt

name: Android CI
on:
  push:
    branches: [ "main", "nova-boost-foundation", "fix/session-network-provenance", "feature/nova-ping-1.11-session-compare", "feature/nova-ping-1.12-diagnostic-reliability", "feature/nova-ping-1.13-animated-ui-optimizer-bridge", "feature/nova-ping-1.14-dashboard-experience", "feature/nova-ping-1.15-reliability-engine", "feature/nova-ping-1.16-measurement-integrity", "audit/nova-ping-1.16-certification", "feature/nova-boost-ui-1.17", "feature/nova-ping-1.18-evidence-gating", "feature/nova-ping-1.19-comparison-integrity", "feature/nova-ping-1.20-game-evidence-registry", "feature/nova-ping-1.21-game-discovery", "feature/nova-ping-1.22-public-network-intelligence", "fix/game-evidence-endpoint-validation", "feature/nova-ping-hev-metadata-hooks" ]
  pull_request:
    branches: [ "main", "fix/game-evidence-endpoint-validation" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOVA_PACKET_FIXTURES: ${{ github.workspace }}/test-fixtures/packet_metadata_vectors.tsv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate pinned HEV metadata integration patch
        run: bash scripts/prepare-hev-metadata.sh "${RUNNER_TEMP}/hev-socks5-tunnel"
      - name: Build patched HEV Android native libraries
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/ndk-build"
          HEV_DIR="${RUNNER_TEMP}/hev-socks5-tunnel"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH="$HEV_DIR" \
            APP_BUILD_SCRIPT="$HEV_DIR/Android.mk" \
            NDK_APPLICATION_MK="$HEV_DIR/Application.mk" \
            APP_ABI="arm64-v8a armeabi-v7a x86 x86_64" \
            APP_PLATFORM=android-29 \
            NDK_OUT="${RUNNER_TEMP}/hev-obj" \
            NDK_LIBS_OUT="${RUNNER_TEMP}/hev-libs" \
            -j2

      - name: Package HEV native libraries for Android APK
        shell: bash
        run: |
          HEV_LIBS="${RUNNER_TEMP}/hev-libs"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            source_lib="$HEV_LIBS/$abi/libhev-socks5-tunnel.so"
            test -s "$source_lib"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$source_lib" "app/src/main/jniLibs/$abi/"
            "$READELF" -Ws "$source_lib" | grep -q 'Java_com_novaping_app_HevMetadataNative_nativePoll'
            "$READELF" -Ws "$source_lib" | grep -q 'hev_socks5_tunnel_metadata_poll'
          done

      - name: Run native packet metadata tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I native/metadata \
            native/metadata/packet_metadata.c \
            native/metadata/pbuf_reader_adapter.c \
            native/metadata/metadata_tap.c \
            native/metadata/packet_metadata_test.c \
            -o /tmp/nova-packet-metadata-test
          /tmp/nova-packet-metadata-test test-fixtures/packet_metadata_vectors.tsv
      - name: Run native packet metadata sanitizer tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I native/metadata \
            native/metadata/packet_metadata.c \
            native/metadata/pbuf_reader_adapter.c \
            native/metadata/metadata_tap.c \
            native/metadata/packet_metadata_test.c \
            -o /tmp/nova-packet-metadata-sanitized
          /tmp/nova-packet-metadata-sanitized test-fixtures/packet_metadata_vectors.tsv
      - name: Cross-compile native metadata for Android ABIs
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$CLANG"
          for target in \
            aarch64-linux-android26 \
            armv7a-linux-androideabi26 \
            i686-linux-android26 \
            x86_64-linux-android26; do
            abi="${target%-*}"
            echo "Compiling native metadata for $target"
            "$CLANG" --target="$target" -std=c11 -Wall -Wextra -Werror -pedantic \
              -fPIC -I native/metadata \
              -c native/metadata/packet_metadata.c \
              -o "/tmp/nova-packet-metadata-$target.o"
            "$CLANG" --target="$target" -std=c11 -Wall -Wextra -Werror -pedantic \
              -fPIC -I native/metadata \
              -c native/metadata/pbuf_reader_adapter.c \
              -o "/tmp/nova-pbuf-reader-adapter-$target.o"
            "$CLANG" --target="$target" -std=c11 -Wall -Wextra -Werror -pedantic \
              -fPIC -I native/metadata \
              -c native/metadata/metadata_tap.c \
              -o "/tmp/nova-metadata-tap-$target.o"
            "$CLANG" --target="$target" -std=c11 -Wall -Wextra -Werror -pedantic \
              -fPIC -I native/metadata \
              -c native/metadata/packet_metadata_test.c \
              -o "/tmp/nova-packet-metadata-test-$target.o"
            "$CLANG" --target="$target" -std=c11 -Wall -Wextra -Werror -pedantic \
              native/metadata/android_atomic_abi_probe.c \
              -o "/tmp/nova-atomic-probe-$target"
          done
      - name: Run metric unit tests
        run: gradle :app:testDebugUnitTest
      - name: Run Android Lint
        run: gradle :app:lintDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build release APK
        run: gradle :app:assembleRelease
      - name: Generate release dependency inventory
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt
      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: nova-ping-certification-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: nova-ping-release-dependencies
          path: dependency-report.txt
